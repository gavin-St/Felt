# A Vite build and nothing else: the site is a folder of static files, so the
# only step after `pnpm build` is telling Pages where the folder is.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits rather than racing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # A project repo is served under /<repo>/. A repo named
      # <user>.github.io is served at the root -- leave this unset for that.
      PAGES_BASE_PATH: /Felt
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: web
        run: pnpm build

      - name: Prepare the Pages folder
        working-directory: web
        run: |
          # The router lives in the browser, so a deep link like /Felt/bot/47
          # is a path no file sits at. Pages serves 404.html for those, and a
          # copy of the app there loads and routes to the right page.
          cp dist/index.html dist/404.html
          # Pages runs Jekyll by default, and Jekyll hides folders that start
          # with an underscore.
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
