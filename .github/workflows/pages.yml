# The build renders every route to a file (next.config.ts sets output:
# 'export'), so there is nothing to run and nothing to crawl: pnpm build
# leaves a folder, and that folder is the site.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits rather than racing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # A project repo is served under /<repo>/. A repo named
      # <user>.github.io is served at the root -- set this to '' for that.
      PAGES_BASE_PATH: /Felt
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: web
        run: pnpm build

      - name: Find the exported site
        run: |
          # The export writes under the base path when there is one, since that
          # is the prefix its own links use. Whichever level holds index.html is
          # the level that gets served at /Felt.
          site=web/dist/client
          nested="web/dist/client${PAGES_BASE_PATH}"
          if [ -n "${PAGES_BASE_PATH}" ] && [ -f "${nested}/index.html" ]; then
            site="${nested}"
          fi
          if [ ! -f "${site}/index.html" ]; then
            echo "no index.html under ${site}. The export put it elsewhere:" >&2
            find web/dist/client -maxdepth 3 -name index.html >&2
            exit 1
          fi
          # Pages runs Jekyll by default, and Jekyll hides folders that start
          # with an underscore -- which is where the framework puts every asset.
          touch "${site}/.nojekyll"
          echo "site=${site}" >> "$GITHUB_ENV"
          echo "publishing ${site} ($(find "${site}" -name '*.html' | wc -l) pages)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.site }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
